apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-express-service2
  namespace: deployflow-test
  labels: &id001
    app.kubernetes.io/name: node-express-service2
    app.kubernetes.io/managed-by: deployflow
    app.kubernetes.io/instance: 2202caf2-759b-4fd2-84c2-58f8fac226ba
spec:
  replicas: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
      annotations:
        deployflow.io/config-sha256: 0780ce56ab2db64f83b3ddf83d34574621f408602b077dbc64a72679759cb473
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: node-express-service2
        image: ghcr.io/damibegud/deployflow-node-express-fixture:90f181449847ee24c162357f2e704edec90a5a57
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4587
          name: http
        envFrom:
        - configMapRef:
            name: node-express-service2-config
        env: []
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
