apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-express-service
  namespace: deployflow-test
  labels: &id001
    app.kubernetes.io/name: node-express-service
    app.kubernetes.io/managed-by: deployflow
    app.kubernetes.io/instance: 601c738c-abe7-4206-8270-965576f6e88a
spec:
  replicas: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
      annotations:
        deployflow.io/config-sha256: 0780ce56ab2db64f83b3ddf83d34574621f408602b077dbc64a72679759cb473
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: node-express-service
        image: ghcr.io/damibegud/deployflow-node-express-fixture:2b6c773f3d9d23828db404165603c30533bdf892
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4587
          name: http
        envFrom:
        - configMapRef:
            name: node-express-service-config
        env: []
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
